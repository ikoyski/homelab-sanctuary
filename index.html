<html lang="en">

        @media (max-width: 640px) {
            .header-panel {
                padding: .5rem .65rem !important;
                gap: .5rem;
                min-height: 3.5rem;

            .header-panel .header-brand-copy { display: none !important; }

                width: 2.5rem !important;
                height: 2.5rem !important;
                flex: 0 0 2.5rem;
            }
            .header-panel > .flex:last-child { flex: 1 1 auto; min-width: 0; justify-content: flex-end; }

            #ded-btn { flex: 0 0 2.5rem; width: 2.5rem; height: 2.5rem; }
        }
    </style>
</head>

        </div>

    <script>
        // Host and app names are discovered from Prometheus labels at runtime.

        const canvas = document.createElement('canvas');

        const ctx = canvas.getContext('2d');
        // ===== Ghibli art kit =====

        function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w * 2; c.height = h * 2; const x = c.getContext('2d'); x.scale(2, 2); fn(x, rng(w * h + 7)); const p = ctx.createPattern(c, 'repeat'); p.setTransform(new DOMMatrix().scale(.5)); return p; }
        const T = {
            carpet: mk(40, 40, (x, r) => { x.fillStyle = '#3d3a58'; x.fillRect(0, 0, 40, 40); dots(x, r, 160, 40, 40, ['rgba(255,255,255,.07)', 'rgba(0,0,0,.12)'], 1); x.fillStyle = 'rgba(0,0,0,.3)'; x.fillRect(0, 0, 40, 1); x.fillRect(0, 0, 1, 40); x.fillStyle = 'rgba(255,255,255,.06)'; x.fillRect(1, 1, 39, 1); x.fillRect(1, 1, 1, 39); }),
            wood: mk(96, 32, (x, r) => { for (let j = 0; j < 2; j++) { x.fillStyle = ['#6e4930', '#7b5337'][j]; x.fillRect(0, j * 16, 96, 16); for (let i = 0; i < 7; i++) { x.strokeStyle = i % 2 ? 'rgba(0,0,0,.13)' : 'rgba(255,220,170,.07)'; x.beginPath(); const y = j * 16 + 2 + r() * 12, s = r() * 70; x.moveTo(s, y); x.bezierCurveTo(s + 10, y - 1.5, s + 22, y + 1.5, s + 34, y); x.stroke(); } x.fillStyle = '#34200f'; x.fillRect(0, j * 16, 96, 1); x.fillRect(j * 48 + 20, j * 16, 1, 16); } }),

        const SKIN = ['#fbd5b0', '#f6c39a', '#efb98d', '#fad9bd'], HAIR = ['#2b1d1a', '#4a2e22', '#1f2937', '#6b3a22', '#8a4b2a'], SUIT = ['#3b4a6b', '#2f5d50', '#7a4a2f', '#5b3f78', '#46505e'];

        // ===== Scenes: each one is a small config (see CLAUDE.md "Adding a scene") =====
        const TX = {
            neon: [40, 40, (x, r) => { x.fillStyle = '#14121f'; x.fillRect(0, 0, 40, 40); x.fillStyle = 'rgba(34,211,238,.35)'; x.fillRect(0, 0, 40, 1); x.fillRect(0, 0, 1, 40); dots(x, r, 20, 40, 40, ['rgba(255,62,200,.1)'], 2); }],
            hull: [48, 48, (x, r) => { x.fillStyle = '#2a3140'; x.fillRect(0, 0, 48, 48); x.fillStyle = '#1a202c'; x.fillRect(0, 0, 48, 2); x.fillRect(0, 0, 2, 48); x.fillStyle = '#64748b'; [[5, 5], [43, 5], [5, 43], [43, 43]].forEach(a => x.fillRect(a[0], a[1], 2, 2)); dots(x, r, 30, 48, 48, ['rgba(255,255,255,.04)'], 2); }],
            grass: [64, 64, (x, r) => { x.fillStyle = '#4f8a3a'; x.fillRect(0, 0, 64, 64); dots(x, r, 90, 64, 64, ['#6aa84f', '#3d7230', '#8bc86a'], 1.6); }],
            flag: [64, 32, (x, r) => { x.fillStyle = '#4a4552'; x.fillRect(0, 0, 64, 32); x.fillStyle = '#2b2733'; x.fillRect(0, 0, 64, 1); x.fillRect(0, 16, 64, 1); x.fillRect(0, 0, 1, 16); x.fillRect(32, 16, 1, 16); dots(x, r, 30, 64, 32, ['rgba(255,255,255,.05)', 'rgba(0,0,0,.1)'], 2); }],
            sea: [64, 64, (x, r) => { x.fillStyle = '#7a6f55'; x.fillRect(0, 0, 64, 64); dots(x, r, 80, 64, 64, ['rgba(255,240,200,.1)', 'rgba(0,0,0,.1)'], 1.5); x.strokeStyle = 'rgba(180,255,255,.12)'; for (let i = 0; i < 4; i++) { x.beginPath(); x.moveTo(0, 8 + i * 16); x.bezierCurveTo(16, i * 16, 40, 16 + i * 16, 64, 8 + i * 16); x.stroke(); } }],
            straw: [48, 32, (x, r) => { x.fillStyle = '#b8924a'; x.fillRect(0, 0, 48, 32); for (let i = 0; i < 70; i++) { x.strokeStyle = i % 3 ? 'rgba(230,195,106,.7)' : 'rgba(120,85,30,.5)'; const a = r() * 6.28, px = r() * 48, py = r() * 32; x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * 7, py + Math.sin(a) * 7); x.stroke(); } }],
            field: [48, 24, (x, r) => { x.fillStyle = '#6b4a2e'; x.fillRect(0, 0, 48, 24); x.fillStyle = 'rgba(0,0,0,.22)'; x.fillRect(0, 0, 48, 3); x.fillStyle = 'rgba(255,220,170,.1)'; x.fillRect(0, 3, 48, 2); dots(x, r, 40, 48, 24, ['rgba(0,0,0,.15)', 'rgba(255,230,190,.08)'], 1.3); }],
            lino: [32, 32, (x, r) => { x.fillStyle = '#c9c4a8'; x.fillRect(0, 0, 32, 32); x.fillStyle = '#bdb89a'; x.fillRect(0, 0, 16, 16); x.fillRect(16, 16, 16, 16); dots(x, r, 24, 32, 32, ['rgba(0,0,0,.06)', 'rgba(255,255,255,.08)'], 1.4); x.fillStyle = 'rgba(0,0,0,.08)'; x.fillRect(0, 0, 32, 1); x.fillRect(0, 0, 1, 32); }],
            check: [32, 32, x => { x.fillStyle = '#5a4a7a'; x.fillRect(0, 0, 32, 32); x.fillStyle = '#6a5a8a'; x.fillRect(0, 0, 16, 16); x.fillRect(16, 16, 16, 16); }]
        };
        const txc = {}, tex = k => txc[k] || (txc[k] = mk(...TX[k]));
        // ===== Barnhouse / Farm: creatures and crops instead of office workers =====
        const SP = ['horse', 'cow', 'sheep', 'pig', 'duck', 'chicken', 'goat', 'rabbit'];
        const CR = ['tomato', 'watermelon', 'pumpkin', 'corn', 'rice', 'wheat', 'carrot', 'sunflower'];
        const CC = { tomato: '#e11d48', watermelon: '#2f8f4e', pumpkin: '#f97316', corn: '#fde047', rice: '#e6c35a', wheat: '#d9b04a', carrot: '#fb923c', sunflower: '#fbbf24' };
        // Use one species per host and distribute hosts across the available animal/crop types.
        const spOf = w => {
            if (S.map && S.map[w.host]) return S.map[w.host];
            const sortedHosts = [...hostKeys].sort((a, b) => a.localeCompare(b));
            const hostIndex = sortedHosts.indexOf(w.host);
            return S.list[(hostIndex >= 0 ? hostIndex : hash(w.host)) % S.list.length];
        };
        function animal(c, sp, up, t, ph, blink) {
            const el = (x, y, rx, ry, f, r) => { c.fillStyle = f; c.beginPath(); c.ellipse(x, y, rx, ry, r || 0, 0, 7); c.fill(); };
            const body = { horse: '#8b5a2b', cow: '#f8fafc', sheep: '#f5f5f4', pig: '#f4a6b0', duck: '#fff0a8', chicken: '#f8fafc', goat: '#e5e7eb', rabbit: '#f1f5f9' }[sp] || '#ccc', ec = sp == 'sheep' ? '#f8fafc' : '#1f1a17';
            const bob = up ? Math.sin(t * .06 + ph) * .8 : 0, hy = (up ? -8 : -2) + bob;
            c.save(); c.translate(0, 18); c.rotate(up ? 0 : .16); c.translate(0, -18 + bob * .4);
            if (sp == 'sheep') [[-13, 7], [0, 3], [13, 7], [-8, 16], [8, 16], [0, 14]].forEach(a => el(a[0], a[1], 9, 8, '#f5f5f4')); else el(0, 7, 19, 14, body);
            if (sp == 'cow') { el(-9, 5, 6, 5, '#262626'); el(10, 10, 5, 4, '#262626'); }
            if (sp == 'duck' || sp == 'chicken') el(-11, 8, 5, 8, 'rgba(0,0,0,.08)', .3);
            if (sp == 'horse') { el(-6, hy - 9, 3, 6, '#6b4423', -.3); el(6, hy - 9, 3, 6, '#6b4423', .3); el(0, hy - 8, 3, 9, '#3b2a1a'); }
            if (sp == 'cow') { el(-11, hy - 2, 5, 3, '#f8fafc', .4); el(11, hy - 2, 5, 3, '#f8fafc', -.4); el(-6, hy - 9, 2, 4, '#e5e7eb'); el(6, hy - 9, 2, 4, '#e5e7eb'); }
            if (sp == 'pig') { el(-7, hy - 8, 4, 5, '#e87b8e', -.5); el(7, hy - 8, 4, 5, '#e87b8e', .5); }
            if (sp == 'goat') { el(-12, hy - 1, 5, 2.5, '#e5e7eb', .3); el(12, hy - 1, 5, 2.5, '#e5e7eb', -.3); c.strokeStyle = '#c9a063'; c.lineWidth = 2.5; c.beginPath(); c.moveTo(-4, hy - 8); c.quadraticCurveTo(-8, hy - 18, -13, hy - 15); c.moveTo(4, hy - 8); c.quadraticCurveTo(8, hy - 18, 13, hy - 15); c.stroke(); }
            if (sp == 'rabbit') { el(-4, hy - 17, 3.4, 9, body); el(4, hy - 17, 3.4, 9, body); el(-4, hy - 17, 1.7, 6, '#f9a8d4'); el(4, hy - 17, 1.7, 6, '#f9a8d4'); }
            if (sp == 'chicken') [-3.5, 0, 3.5].forEach((x, k) => el(x, hy - 10 - (k == 1 ? 1 : 0), 2.6, 3, '#dc2626'));
            if (sp == 'sheep') { [-6, 0, 6].forEach(x => el(x, hy - 7, 5, 5, '#f5f5f4')); el(0, hy + 1, 6.5, 7.5, '#52525b'); el(-9, hy, 4, 2, '#52525b', .3); el(9, hy, 4, 2, '#52525b', -.3); }
            else el(0, hy, sp == 'horse' ? 8.5 : 9.5, sp == 'horse' ? 11 : 9.5, body);
            if (sp == 'horse') el(0, hy + 6, 6, 4.5, '#c49a6c'); if (sp == 'cow') el(0, hy + 5, 7, 4.5, '#f9a8d4'); if (sp == 'pig') el(0, hy + 3, 5.5, 4, '#e87b8e');
            if (sp == 'goat') { el(0, hy + 5, 5, 4, '#f3f4f6'); el(0, hy + 11, 2, 3, '#e5e7eb'); }
            if (sp == 'duck') el(0, hy + 4, 6.5, 3, '#fb923c'); if (sp == 'rabbit') el(0, hy + 4, 1.8, 1.3, '#f9a8d4');
            if (sp == 'chicken') { c.fillStyle = '#fb923c'; c.beginPath(); c.moveTo(-2.5, hy + 2); c.lineTo(2.5, hy + 2); c.lineTo(0, hy + 6); c.fill(); el(0, hy + 7, 1.8, 2.4, '#dc2626'); }
            if (sp == 'horse' || sp == 'cow' || sp == 'pig') { const ny = hy + (sp == 'horse' ? 6 : sp == 'pig' ? 3 : 5); c.fillStyle = 'rgba(0,0,0,.45)'; c.fillRect(-2.4, ny, 1.2, 1.4); c.fillRect(1.2, ny, 1.2, 1.4); }
            [-4.5, 4.5].forEach(x => { c.strokeStyle = c.fillStyle = ec; if (!up) { c.lineWidth = 1.1; c.beginPath(); c.moveTo(x - 1.8, hy - 2.8); c.lineTo(x + 1.8, hy + .8); c.moveTo(x + 1.8, hy - 2.8); c.lineTo(x - 1.8, hy + .8); c.stroke(); } else if (blink) c.fillRect(x - 1.8, hy - 1.2, 3.6, 1); else { el(x, hy - 1.2, 1.6, 2, ec); el(x + .5, hy - 1.9, .6, .6, sp == 'sheep' ? '#1f1a17' : '#fff'); } });
            el(-7.5, hy + 2.5, 2, 1.2, 'rgba(240,110,120,.35)'); el(7.5, hy + 2.5, 2, 1.2, 'rgba(240,110,120,.35)');

        function crop(c, sp, up, t, ph) {
            const lf = (x, y, rot, len, col) => { c.save(); c.translate(x, y); c.rotate(rot); c.fillStyle = col; c.beginPath(); c.ellipse(0, -len / 2, len / 4.2, len / 2, 0, 0, 7); c.fill(); c.restore(); };

        function calculateLayout() {
            workstations = [];
            rooms = Object.create(null);

            const maxColsPerRoom = 3;
            const colSpacing = 85;
            const rowSpacing = 92;
            const paddingX = 40;
            const topPadding = 108;
            const bottomPadding = (S.school || S.barracks) ? 170 : 56;
            const roomGap = 25;
            const maxRowWidth = layoutMaxW || Math.min(1500, window.innerWidth * 1.1);

            const roomMeta = hostKeys.map(host => {
                const apps = hostAppSchema[host];
                const totalApps = apps.length;
                const effectiveCols = Math.min(totalApps, maxColsPerRoom);
                const effectiveRows = Math.ceil(totalApps / maxColsPerRoom);

                const width = Math.max(280, effectiveCols * colSpacing + paddingX * 2);
                const height = Math.max(200, effectiveRows * rowSpacing + topPadding + bottomPadding);
                return { host, apps, width, height };
            });

            let rows = [];
            let currentRow = [];
            let currentRowWidth = 0;

            roomMeta.forEach(room => {
                if (currentRow.length > 0 && currentRowWidth + room.width + roomGap > maxRowWidth) {
                    rows.push(currentRow);
                    currentRow = [room];
                    currentRowWidth = room.width;
                } else {
                    currentRow.push(room);
                    currentRowWidth += room.width + (currentRow.length > 1 ? roomGap : 0);
                }
            });
            if (currentRow.length > 0) {
                rows.push(currentRow);
            }

            const absoluteMaxWidth = Math.max(...roomMeta.map(r => r.width));

            let standardizedRows = rows.map(rowRooms => {
                const rowMaxHeight = Math.max(...rowRooms.map(r => r.height));
                return rowRooms.map(r => ({
                    ...r,
                    width: absoluteMaxWidth,
                    height: rowMaxHeight
                }));
            });

            let totalBlockHeight = 0;
            const rowHeights = standardizedRows.map(rowRooms => rowRooms[0].height);
            totalBlockHeight = rowHeights.reduce((a, b) => a + b, 0) + (standardizedRows.length - 1) * roomGap;

            let currentGridY = -totalBlockHeight / 2;

            standardizedRows.forEach((rowRooms, rowIndex) => {
                const maxHeight = rowHeights[rowIndex];
                const totalRowWidth = rowRooms.reduce((sum, r) => sum + r.width, 0) + (rowRooms.length - 1) * roomGap;
                let startX = -totalRowWidth / 2;

                rowRooms.forEach(room => {
                    const rx = startX + room.width / 2;
                    const rz = currentGridY + maxHeight / 2;

                    rooms[room.host] = { x: rx, z: rz, width: room.width, height: maxHeight };

                    let dx = rx - room.width / 2 + paddingX + 12 + (S.school ? 30 : 0);
                    let dz = rz - maxHeight / 2 + topPadding;

                    room.apps.forEach((app, appIdx) => {
                        if (appIdx > 0 && appIdx % maxColsPerRoom === 0) {
                            dx = rx - room.width / 2 + paddingX + 12;
                            dz += rowSpacing;
                        }

                        const hs = hash(room.host + app);
                        workstations.push({
                            host: room.host, app: app, hs,
                            name: `${(S.fn || firstNames)[hs % (S.fn || firstNames).length]} ${(S.ln || lastNames)[(hs >>> 4) % (S.ln || lastNames).length]}`.trim(),

        async function fetchPrometheusMetrics() {
            try {
                const res = await fetch(`/api/v1/query?query=probe_success`);
                if (!res.ok) throw new Error(`Prometheus query failed: HTTP ${res.status}`);
                const json = await res.json();
                if (json.status === 'success' && Array.isArray(json.data?.result)) {
                    let schemaChanged = false;
                    // Reset known pairs on every successful query. A vanished series cannot stay falsely green.
                    Object.keys(hostAppSchema).forEach(knownHost => {
                        hostAppSchema[knownHost].forEach(knownApp => { liveServiceState[`${knownHost}:${knownApp}`] = false; });
                    });
                    json.data.result.forEach(metric => {
                        const host = metric.metric && metric.metric.host;
                        const app = metric.metric && metric.metric.app;
                        const rawValue = metric.value && metric.value[1];
                        const val = Number(rawValue);
                        if (rawValue === undefined || rawValue === null || rawValue === '' ||
                            typeof host !== 'string' || !host.trim() ||
                            typeof app !== 'string' || !app.trim() ||
                            !Number.isFinite(val)) return;

                        // Dynamically discover every host/app pair present in Prometheus.
                        if (!hostAppSchema[host]) {
                            hostAppSchema[host] = [];
                            schemaChanged = true;
                        }
                        if (!hostAppSchema[host].includes(app)) {
                            hostAppSchema[host].push(app);
                            schemaChanged = true;
                        }
                        liveServiceState[`${host}:${app}`] = (val === 1);
                    });

                    if (schemaChanged) {
                        hostKeys = Object.keys(hostAppSchema);
                        resize();
                    }
                    updateUIRegistry();
                }
            } catch (e) {
                updateUIRegistry();
            }

            document.getElementById('ded-text').textContent = DEDICATION.text || 'Add your dedication to the DEDICATION constant in index.html.';
            document.getElementById('ded-from').textContent = DEDICATION.from || '';
            const open = () => { m.classList.remove('hidden'); m.classList.add('flex'); document.getElementById('ded-close').focus(); };
            const close = () => { m.classList.add('hidden'); m.classList.remove('flex'); b.focus(); };
            b.addEventListener('click', open); document.getElementById('ded-close').addEventListener('click', close);
            m.addEventListener('click', e => { if (e.target === m) close(); });
            window.addEventListener('keydown', e => { if (e.key === 'Escape' && !m.classList.contains('hidden')) close(); });
        })();
        const sel = document.getElementById('scene-select');
        Object.keys(SC).forEach(k => { const o = document.createElement('option'); o.value = k; o.textContent = SC[k].n; o.className = 'bg-stone-900'; sel.appendChild(o); });
        let savedScene = 'ghibli'; try { savedScene = localStorage.getItem('scene') || 'ghibli'; } catch (e) { }
        sel.value = SC[savedScene] ? savedScene : 'ghibli'; sel.addEventListener('change', () => setScene(sel.value)); setScene(sel.value);
        fetchPrometheusMetrics();
        setInterval(fetchPrometheusMetrics, 10000);
    </script>
</body>
